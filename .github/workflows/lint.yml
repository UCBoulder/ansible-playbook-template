---
name: "Linting Tests"
on:
  # Our workflow encourages/requires PRs, to save resources we only test on PR not push.
  pull_request:
    # Set the paths you wish to trigger the workflow here
    paths:
      - '*.yml'
      - '.github/workflows/lint.yml'
      - 'tasks/*.yml'
      - 'vars/*.yml'
  # Allow for manual triggering of jobs, can be handy for debugging and doesn't hurt.
  workflow_dispatch:

# References
# https://github.com/actions/setup-python
# https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      PY_COLORS: 1
      ANSIBLE_FORCE_COLOR: 1
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # For performance, use a Python version that is cached on GitHub's runner
      # images (see the Python section of the Ubuntu README linked in comments
      # above).
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Package Dependencies
        run: |
          pip install ansible ansible-lint jmespath yamllint

      - name: Run YAMLlint tests
        run: >-
          yamllint --version &&
          ansible --version &&
          yamllint .

      - name: 'Run Ansible lint tests'
        run: >-
          ansible-lint --version &&
          ansible-lint
